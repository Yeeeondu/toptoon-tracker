<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>탑툰챗 트래커</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">TOPTOON CHAT · 공개 카운터</p>
      <h1 id="title">탑툰챗 트래커</h1>
    </div>
    <p class="updated" id="updated">데이터를 불러오는 중…</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="국가 선택"></nav>

  <!-- 종합: 국가별 View·Chat 절대값 -->
  <section id="view-all">
    <div class="controls">
      <div class="seg" id="range" role="group" aria-label="기간">
        <button data-v="0" class="on">전체</button>
        <button data-v="90">90일</button>
        <button data-v="30">30일</button>
      </div>
      <p class="hint">집계 기준: 매일 사이트에 공개된 전체 작품(캐릭터·작품)의 합계 · 첫 수집일부터 누적 표시</p>
    </div>
    <div class="countries" id="countries"></div>
  </section>

  <!-- 국가 탭: 합계를 만드는 작품별 원자료 -->
  <section id="view-market" hidden>
    <section class="panel table-panel">
      <div class="table-head">
        <div class="table-title">
          <h2>작품별 카운터</h2>
          <select id="date" aria-label="수집일"></select>
        </div>
        <div class="table-tools">
          <input id="search" type="search" placeholder="작품 이름 검색">
          <button id="csv" class="ghost">CSV 저장</button>
        </div>
      </div>
      <p class="sub" id="table-sub"></p>
      <div class="table-scroll"><table id="table"><thead></thead><tbody></tbody></table></div>
    </section>
  </section>

  <footer class="foot">공개 페이지에 표시되는 누적 카운터를 매일 아침 기록합니다. 매출이나 실제 이용자 수와는 다릅니다.</footer>
</div>
<div class="tip" id="tip" hidden></div>
<script src="app.js"></script>
</body>
</html>
