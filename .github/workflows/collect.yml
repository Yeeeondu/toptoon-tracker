name: 수집 및 배포

on:
  schedule:
    # 한국시간 = UTC+9. 07:05 KST 기본 수집, 07:35·09:05 KST는 지연·실패 대비 재시도
    # (이미 오늘 아침 수집이 있으면 자동으로 건너뜁니다)
    - cron: "5 22 * * *"
    - cron: "35 22 * * *"
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 수집했어도 다시 수집"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_try.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 공개 카운터 수집
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python collector/collect.py --force
          else
            python collector/collect.py
          fi

      - name: 바뀐 데이터 저장
        id: save
        if: github.event_name != 'push'
        run: |
          git add site/data
          if git diff --cached --quiet; then
            echo "바뀐 데이터가 없습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d') 수집"
          git pull --rebase origin main
          git push origin HEAD:main

      # 예약 실행인데 오늘 이미 수집돼 바뀐 게 없으면 배포를 건너뜁니다(불필요한 재배포·실패 메일 방지)
      - name: 배포 필요 여부
        id: need
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.save.outputs.changed }}" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "바뀐 데이터가 없어 배포를 건너뜁니다."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 캐시 무효화용 버전 표시
        if: steps.need.outputs.deploy == 'true'
        run: sed -i "s/__V__/${{ github.sha }}/g" site/index.html

      - uses: actions/configure-pages@v6
        if: steps.need.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.need.outputs.deploy == 'true'
        with:
          path: site
      # GitHub 쪽 일시 오류(artifact metadata 조회 실패)가 잦아서 실패하면 한 번 더 시도합니다
      - id: deploy_try
        if: steps.need.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: 배포 재시도 대기
        if: steps.need.outputs.deploy == 'true' && steps.deploy_try.outcome == 'failure'
        run: sleep 45
      - id: deploy
        if: steps.need.outputs.deploy == 'true' && steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: 수집 실패 알림
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::일부 국가 수집에 실패했습니다. 위 '공개 카운터 수집' 로그를 확인하세요."
          exit 1
